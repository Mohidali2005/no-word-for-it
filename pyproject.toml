[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nwf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy","scipy","matplotlib","pillow","torch","transformers","accelerate","pandas","pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]
